<meta charset="utf-8">
<title>院長の駄洒落10連発</title>
<style>
@font-face{font-family:'NSJP';src:url('fonts/NotoSansJP-900.ttf') format('truetype');font-weight:900;}
@font-face{font-family:'NSJP';src:url('fonts/NotoSansJP-700.ttf') format('truetype');font-weight:700;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:'NSJP',sans-serif;-webkit-font-smoothing:antialiased}
.page{width:1200px;height:1800px;background:
   radial-gradient(120% 80% at 50% 0%, #14508f 0%, #0b2c55 45%, #071c38 100%);
   border:14px solid #000;padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;position:relative}
.page::after{content:'';position:absolute;inset:0;pointer-events:none;
   background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 2px,transparent 2px 4px)}

/* ---------- header ---------- */
.head{height:150px;display:flex;align-items:center;gap:16px;position:relative;z-index:2}
.head .mug{width:132px;height:150px;flex:none}
.head .titlebox{flex:1;background:#000;border:5px solid #fff;border-radius:12px;height:118px;
   display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.55)}
.head h1{font-weight:900;font-size:66px;color:#fff;letter-spacing:.02em;line-height:1;white-space:nowrap}
.head h1 .y{color:#ffd233}
.head h1 .n{color:#ff5a4d}

/* ---------- grid ---------- */
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px;position:relative;z-index:2}
.panel{background:#08182e;border:5px solid #000;border-radius:12px;overflow:hidden;
   display:flex;flex-direction:column;box-shadow:0 4px 0 rgba(0,0,0,.5), inset 0 0 0 2px #24476f}
.ph{background:#000;display:flex;gap:10px;align-items:flex-start;padding:9px 12px 8px;min-height:70px}
.num{flex:none;width:34px;height:34px;background:#2f7fd0;color:#fff;font-weight:900;font-size:23px;
   display:flex;align-items:center;justify-content:center;border-radius:5px}
.ph p{font-weight:900;font-size:25px;line-height:1.22;color:#ffd233;letter-spacing:.005em}
.ph p .w{color:#fff}
.art{position:relative;flex:1;overflow:hidden;background:#0d2140}
.figure{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.45))}
.art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.bub{position:absolute;background:#fff;border:4px solid #111;border-radius:16px;
   padding:8px 13px 9px;font-weight:900;font-size:20px;line-height:1.2;color:#111;
   text-align:center;box-shadow:3px 4px 0 rgba(0,0,0,.4);z-index:5;white-space:pre-line}
.bub::after{content:'';position:absolute;left:14px;bottom:-19px;width:0;height:0;
   border:10px solid transparent;border-top:16px solid #111}
.bub::before{content:'';position:absolute;left:16px;bottom:-11px;width:0;height:0;z-index:1;
   border:8px solid transparent;border-top:13px solid #fff}
.bub.r::after{left:auto;right:14px}.bub.r::before{left:auto;right:16px}

/* ---------- footer ---------- */
.foot{height:72px;background:#000;border:4px solid #ffd233;border-radius:12px;
   display:flex;align-items:center;justify-content:center;gap:18px;position:relative;z-index:2}
.foot b{font-weight:900;font-size:34px;color:#fff}
.foot b em{color:#ffd233;font-style:normal}
.foot span{font-weight:700;font-size:20px;color:#9fc4ea}
</style>
<div class="page">
  <div class="head">
    <svg class="mug" viewBox="0 0 200 260"></svg>
    <div class="titlebox"><h1>院長の<span class="y">駄洒落</span><span class="n">10</span>連発</h1></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot"><b>新作駄洒落 <em>募集中！</em></b><span>#石倉クリニック　#院長語録</span></div>
</div>

/* ============================ 院長イラスト ============================ */
const SKIN='#f0c39c', SKIN_D='#b8815a', SCRUB='#2f6fb0', SCRUB_D='#123a63';
function limb(d,w,col,dark){return `<path d="${d}" fill="none" stroke="${dark}" stroke-width="${w+7}" stroke-linecap="round"/>
 <path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`}
function hand(x,y,r=13){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${SKIN}" stroke="${SKIN_D}" stroke-width="3"/>`}

 point:()=>limb('M150 152 C 176 150, 186 136, 184 116',26,SCRUB,SCRUB_D)

   +limb('M50 154 C 34 162, 28 178, 30 196',26,SCRUB,SCRUB_D)+hand(32,204,12),
 chin:()=>limb('M52 156 C 34 168, 30 186, 34 200',26,SCRUB,SCRUB_D)+hand(36,206,12)
   +limb('M150 156 C 168 158, 166 140, 150 130',26,SCRUB,SCRUB_D)
   +limb('M150 130 L 126 122',20,SKIN,SKIN_D)+hand(118,120,14),
 phone:()=>limb('M150 154 C 172 148, 176 126, 166 108',26,SCRUB,SCRUB_D)
   +limb('M166 108 L 156 92',20,SKIN,SKIN_D)+hand(152,84,14)
   +`<rect x="140" y="58" width="24" height="42" rx="6" transform="rotate(12 152 79)" fill="#1b2430" stroke="#000" stroke-width="3"/>`
   +limb('M50 154 C 34 162, 28 178, 30 196',26,SCRUB,SCRUB_D)+hand(32,204,12),

   +limb('M170 120 L 158 108',20,SKIN,SKIN_D)+hand(152,102,15)+limb('M152 94 L 152 78',9,SKIN,SKIN_D)
   +limb('M50 154 C 34 162, 28 178, 30 196',26,SCRUB,SCRUB_D)+hand(32,204,12),
 open:()=>limb('M150 152 C 176 154, 190 168, 190 190',26,SCRUB,SCRUB_D)+hand(190,198,14)
   +limb('M50 152 C 24 154, 10 168, 10 190',26,SCRUB,SCRUB_D)+hand(10,198,14)
};
const FACE={

};
function doctor(pose='point',expr='smile',brow='up'){
 const eye=(x)=>`<ellipse cx="${x}" cy="82" rx="9" ry="8" fill="#fff" stroke="#4a3227" stroke-width="2.5"/>
   <circle cx="${x+1}" cy="83" r="4.2" fill="#241a14"/><circle cx="${x+3}" cy="81" r="1.4" fill="#fff"/>`;
 const brows= brow==='up'
  ? `<path d="M70 66 Q82 59 94 65" fill="none" stroke="#2b2119" stroke-width="6" stroke-linecap="round"/>
     <path d="M106 65 Q118 59 130 66" fill="none" stroke="#2b2119" stroke-width="6" stroke-linecap="round"/>`
  : `<path d="M70 62 Q82 68 94 66" fill="none" stroke="#2b2119" stroke-width="6" stroke-linecap="round"/>

  <path d="M100 130 C 58 134, 32 152, 24 192 L 16 262 L 184 262 L 176 192 C 168 152, 142 134, 100 130 Z"

  <rect x="140" y="176" width="34" height="30" rx="3" fill="#2a63a1" stroke="${SCRUB_D}" stroke-width="3"/>

  <path d="M150 76 C 152 58, 144 44, 132 38 L 126 52 C 138 58, 144 64, 145 82 Z" fill="#2b2119"/>

  <path d="M62 22 C 74 12, 92 8, 100 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  ${brows}${eye(84)}${eye(116)}
  <path d="M100 84 L94 100 Q100 104 106 100" fill="none" stroke="${SKIN_D}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  ${FACE[expr]}
 </g>`;
}
